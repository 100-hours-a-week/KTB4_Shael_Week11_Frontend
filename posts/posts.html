<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 목록</title>

  <link rel="stylesheet" href="./posts.css" />
</head>

<body>
  <header class="top-banner">
    <h1 class="banner-title">아무 말 대잔치</h1>

    <div class="header-profile-area">
      <button type="button" id="headerProfileButton" class="header-profile-button" data-action="toggle-profile-menu"
        aria-label="프로필 메뉴 열기" aria-haspopup="true" aria-expanded="false">
        <img id="headerProfileImage" class="header-profile-image" src="" alt="사용자 프로필 이미지"
          data-profile="current-user" />
      </button>

      <nav id="profileDropdown" class="profile-dropdown hidden" data-menu="profile" aria-label="프로필 메뉴">
        <button type="button" id="editProfileButton" class="dropdown-item" data-action="edit-profile">
          회원정보 수정
        </button>

        <button type="button" id="editPasswordButton" class="dropdown-item" data-action="edit-password">
          비밀번호 수정
        </button>

        <button type="button" id="logoutButton" class="dropdown-item" data-action="logout">
          로그아웃
        </button>
      </nav>
    </div>
  </header>

  <main class="posts-page">
    <section class="posts-container" aria-labelledby="boardIntroTitle">
      <div class="board-header">
        <h2 id="boardIntroTitle" class="board-intro">
          안녕하세요,<br />
          아무 말 대잔치 <strong>게시판</strong> 입니다.
        </h2>

        <button type="button" id="createPostButton" class="create-post-button" data-action="create-post">
          게시글 작성
        </button>
      </div>

      <section id="postList" class="post-list" data-list="posts" aria-label="게시글 목록"> </section>
    </section>
  </main>
  <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>
  <script src="./posts.js"></script>
</body>

</html>
