<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>

  <link rel="stylesheet" href="./login.css" />
</head>

<body>
  <header class="top-banner">
    <h1 class="banner-title">아무 말 대잔치</h1>
  </header>

  <main class="login-page">
    <section class="login-container" aria-labelledby="loginTitle">
      <h2 id="loginTitle" class="login-title">로그인</h2>

      <form id="loginForm" novalidate class="login-form" data-form="login">
        <div class="login-box">
          <div class="form-group" data-field="email">
            <label for="emailInput" class="form-label">이메일</label>
            <input type="email" id="emailInput" required class="form-input" name="email" placeholder="이메일을 입력하세요"
              autocomplete="email" data-input="email" />
          </div>

          <div class="form-group" data-field="password">
            <label for="passwordInput" class="form-label">비밀번호</label>
            <input type="password" id="passwordInput" required class="form-input" name="password"
              placeholder="비밀번호를 입력하세요" autocomplete="current-password" data-input="password" />
          </div>

          <p id="loginError" class="error-message hidden" data-error="login">
          </p>
        </div>

        <button type="submit" id="loginButton" class="login-button" data-action="login">
          로그인
        </button>

        <button type="button" id="signupButton" class="signup-button" data-action="signup">
          회원가입
        </button>
      </form>
    </section>
  </main>
  <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>
  <script src="./login.js"></script>
</body>

</html>
