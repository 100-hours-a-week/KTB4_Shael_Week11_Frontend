<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>회원정보수정</title>

  <link rel="stylesheet" href="./profile-edit.css" />
</head>

<body>
  <header class="top-banner">
    <button type="button" id="backButton" class="back-button" data-action="go-post-list" aria-label="게시글 목록 페이지로 이동">
      &lt;
    </button>

    <h1 class="banner-title">아무 말 대잔치</h1>

    <div class="header-profile-area" data-component="profile-menu">
      <button type="button" id="headerProfileButton" class="header-profile-button" data-action="toggle-profile-menu"
        aria-label="프로필 메뉴 열기" aria-haspopup="true" aria-expanded="false">
        <img id="headerProfileImage" class="header-profile-image" src="../images/default-profile.png" alt="사용자 프로필 이미지"
          data-profile="current-user" />
      </button>

      <nav id="profileDropdown" class="profile-dropdown hidden" data-menu="profile" aria-label="프로필 메뉴">
        <button type="button" id="editProfileButton" class="dropdown-item" data-action="edit-profile">
          회원정보 수정
        </button>

        <button type="button" id="editPasswordButton" class="dropdown-item" data-action="edit-password">
          비밀번호 수정
        </button>

        <button type="button" id="logoutButton" class="dropdown-item" data-action="logout">
          로그아웃
        </button>
      </nav>
    </div>
  </header>

  <main class="profile-edit-page">
    <section class="profile-edit-container" aria-labelledby="profileEditTitle">
      <h2 id="profileEditTitle" class="profile-edit-title">회원정보수정</h2>

      <form id="profileEditForm" class="profile-edit-form" data-form="profile-edit">
        <div class="profile-image-section" data-field="profile-image">
          <label for="profileImageInput" class="profile-form-label">
            프로필 사진*
          </label>

          <div class="profile-image-wrapper">
            <img id="currentProfileImage" class="current-profile-image" src="../images/default-profile.png"
              alt="현재 프로필 사진" data-profile-preview="profile-image" />

            <label for="profileImageInput" id="profileImageChangeButton" class="profile-image-change-button"
              data-action="change-profile-image">
              변경
            </label>

            <input type="file" id="profileImageInput" class="profile-image-input" name="profileImage" accept="image/*"
              data-input="profile-image" />

            <p id="profileImageError" class="profile-error-message hidden" data-error="profileImage">
            </p>
          </div>
        </div>

        <div class="profile-field-section" data-field="email">
          <p class="profile-form-label">이메일</p>

          <p id="userEmailText" class="user-email-text" data-user-field="email">
          </p>
        </div>

        <div class="profile-field-section nickname-section" data-field="nickname">
          <label for="nicknameInput" class="profile-form-label">
            닉네임
          </label>

          <input type="text" id="nicknameInput" required class="nickname-input" name="nickname" maxlength="10" value=""
            placeholder="닉네임을 입력해주세요." data-input="nickname" />

          <p id="nicknameError" class="profile-error-message hidden" data-error="nickname">
          </p>
        </div>

        <button type="submit" id="profileEditSubmitButton" class="profile-edit-submit-button disabled"
          data-action="submit-profile-edit" disabled>
          수정하기
        </button>
      </form>

      <button type="button" id="withdrawButton" class="withdraw-button" data-action="open-withdraw-modal">
        회원 탈퇴
      </button>

      <div id="profileEditToast" class="profile-edit-toast hidden" data-toast="profile-edit-success" role="status"
        aria-live="polite">
        수정 완료
      </div>
      <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive">
      </div>
    </section>
  </main>

  <div id="withdrawModalOverlay" class="modal-overlay hidden" data-modal="withdraw" aria-hidden="true">
    <section id="withdrawModal" class="withdraw-modal" role="dialog" aria-modal="true"
      aria-labelledby="withdrawModalTitle" aria-describedby="withdrawModalDescription">
      <div class="withdraw-modal-content">
        <h3 id="withdrawModalTitle" class="withdraw-modal-title">
          회원탈퇴 하시겠습니까?
        </h3>

        <p id="withdrawModalDescription" class="withdraw-modal-description">
          작성된 게시글과 댓글은 삭제되지 않습니다.
        </p>

        <div class="withdraw-modal-actions">
          <button type="button" id="withdrawCancelButton" class="withdraw-modal-button cancel-button"
            data-action="cancel-withdraw">
            취소
          </button>

          <button type="button" id="withdrawConfirmButton" class="withdraw-modal-button confirm-button"
            data-action="confirm-withdraw">
            확인
          </button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./profile-edit.js"></script>
</body>

</html>
