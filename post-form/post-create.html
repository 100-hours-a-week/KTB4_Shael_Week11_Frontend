<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 작성</title>

    <link rel="stylesheet" href="./post-form.css" />
</head>

<body>
    <header class="top-banner">
        <button type="button" id="backButton" class="back-button" data-action="go-post-list"
            aria-label="게시글 목록 페이지로 이동">
            &lt;
        </button>

        <h1 class="banner-title">아무 말 대잔치</h1>

        <div class="header-profile-area" data-component="profile-menu">
            <button type="button" id="headerProfileButton" class="header-profile-button"
                data-action="toggle-profile-menu" aria-label="프로필 메뉴 열기" aria-haspopup="true" aria-expanded="false">
                <img id="headerProfileImage" class="header-profile-image" src="../images/default-profile.png"
                    alt="사용자 프로필 이미지" data-profile="current-user" />
            </button>

            <nav id="profileDropdown" class="profile-dropdown hidden" data-menu="profile" aria-label="프로필 메뉴">
                <button type="button" id="editProfileButton" class="dropdown-item" data-action="edit-profile">
                    회원정보 수정
                </button>

                <button type="button" id="editPasswordButton" class="dropdown-item" data-action="edit-password">
                    비밀번호 수정
                </button>

                <button type="button" id="logoutButton" class="dropdown-item" data-action="logout">
                    로그아웃
                </button>
            </nav>
        </div>
    </header>

    <main class="post-form-page">
        <section class="post-form-container" aria-labelledby="postFormTitle">
            <h2 id="postFormTitle" class="post-form-title">게시글 작성</h2>

            <form id="postCreateForm" class="post-form" data-form="post" data-mode="create">

                <div class="form-section" data-field="title">
                    <label for="postTitleInput" class="form-label">제목*</label>

                    <div class="form-divider"></div>

                    <input type="text" id="postTitleInput" required class="title-input" name="title" maxlength="26"
                        placeholder="제목을 입력해주세요. (최대 26글자)" data-input="title" />

                    <div class="form-divider"></div>

                    <p id="titleError" class="error-message hidden" data-error="title">
                    </p>
                </div>


                <div class="form-section content-section" data-field="content">
                    <label for="postContentInput" class="form-label">내용*</label>

                    <div class="form-divider"></div>

                    <textarea id="postContentInput" required class="content-input" name="content"
                        placeholder="내용을 입력해주세요." data-input="content"></textarea>

                    <div class="form-divider"></div>

                    <p id="contentError" class="error-message hidden" data-error="content">
                    </p>
                </div>


                <div class="form-section image-section" data-field="image">
                    <label for="postImageInput" class="form-label">이미지</label>

                    <p id="imageError" class="error-message image-error hidden" data-error="images">
                    </p>

                    <div class="file-row">
                        <label for="postImageInput" id="fileSelectButton" class="file-select-button"
                            data-action="select-images">
                            파일 선택
                        </label>

                        <input type="file" id="postImageInput" class="file-input" name="images" accept="image/*"
                            multiple data-input="images" />

                        <span id="selectedFileText" class="selected-file-text" data-state="selected-file-text">
                            파일을 선택해주세요.
                        </span>
                    </div>

                    <div id="imagePreviewList" multiple class="image-preview-list hidden" data-list="image-preview"
                        aria-label="선택한 이미지 미리보기">
                    </div>
                </div>

                <button type="submit" id="completeButton" class="complete-button disabled" data-action="submit-post"
                    disabled>
                    완료
                </button>
            </form>
        </section>
    </main>
    <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>
    <script type="module" src="./post-create.js"></script>
</body>

</html>
