<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입</title>

  <link rel="stylesheet" href="./signup.css" />
</head>

<body>
  <header class="top-banner">
    <button type="button" id="backButton" class="back-button" data-action="go-login" aria-label="로그인 페이지로 이동">
      &lt;
    </button>

    <h1 class="banner-title">아무 말 대잔치</h1>
  </header>

  <main class="signup-page">
    <section class="signup-container" aria-labelledby="signupTitle">
      <h2 id="signupTitle" class="signup-title">회원가입</h2>

      <form id="signupForm" class="signup-form" novalidate data-form="signup">
        <div class="signup-box">
          <div class="profile-section" data-field="profileImage">
            <p class="profile-label">프로필 사진</p>

            <p id="profileError" class="error-message profile-error hidden" data-error="profileImage">
            </p>

            <div class="profile-upload-wrapper">
              <button type="button" id="profileUploadButton" class="profile-upload-button" data-action="upload-profile"
                aria-label="프로필 사진 업로드">
                <span class="profile-plus-icon">+</span>
                <img id="profilePreview" class="profile-preview hidden" src="" alt="업로드한 프로필 이미지 미리보기"
                  data-preview="profileImage" />
              </button>

              <input type="file" id="profileImageInput" required class="profile-file-input" name="profileImage"
                accept="image/*" data-input="profileImage" />
            </div>
          </div>

          <div class="form-group" data-field="email">
            <label for="emailInput" class="form-label">이메일</label>
            <input type="email" id="emailInput" required class="form-input" name="email" placeholder="이메일을 입력하세요"
              autocomplete="email" data-input="email" />
            <p id="emailError" class="error-message hidden" data-error="email">
            </p>
          </div>

          <div class="form-group" data-field="password">
            <label for="passwordInput" class="form-label">비밀번호</label>
            <input type="password" id="passwordInput" required class="form-input" name="password"
              placeholder="비밀번호를 입력하세요" autocomplete="new-password" data-input="password" />
            <p id="passwordError" class="error-message hidden" data-error="password">
            </p>
          </div>

          <div class="form-group" data-field="passwordConfirm">
            <label for="passwordConfirmInput" class="form-label">
              비밀번호 확인
            </label>
            <input type="password" id="passwordConfirmInput" required class="form-input" name="passwordConfirm"
              placeholder="비밀번호를 한번 더 입력하세요" autocomplete="new-password" data-input="passwordConfirm" />
            <p id="passwordConfirmError" class="error-message hidden" data-error="passwordConfirm">
            </p>
          </div>

          <div class="form-group" data-field="nickname">
            <label for="nicknameInput" class="form-label">닉네임</label>
            <input type="text" id="nicknameInput" required class="form-input" name="nickname" placeholder="닉네임을 입력하세요"
              autocomplete="nickname" data-input="nickname" />
            <p id="nicknameError" class="error-message hidden" data-error="nickname">
            </p>
          </div>
        </div>

        <button type="submit" id="signupButton" class="signup-button disabled" data-action="signup" disabled>
          회원가입
        </button>

        <button type="button" id="loginMoveButton" class="login-move-button" data-action="go-login">
          로그인하러 가기
        </button>
      </form>
    </section>
  </main>
  <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>
  <script src="./signup.js"></script>
</body>

</html>
