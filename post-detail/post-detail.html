<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 상세 조회</title>

  <link rel="stylesheet" href="./post-detail.css" />
</head>

<body>
  <header class="top-banner">
    <button type="button" id="backButton" class="back-button" data-action="go-post-list" aria-label="게시글 목록 페이지로 이동">
      &lt;
    </button>

    <h1 class="banner-title">아무 말 대잔치</h1>

    <div class="header-profile-area" data-component="profile-menu">
      <button type="button" id="headerProfileButton" class="header-profile-button" data-action="toggle-profile-menu"
        aria-label="프로필 메뉴 열기" aria-haspopup="true" aria-expanded="false">
        <img id="headerProfileImage" class="header-profile-image" alt="사용자 프로필 이미지" data-profile="current-user" />
      </button>

      <nav id="profileDropdown" class="profile-dropdown hidden" data-menu="profile" aria-label="프로필 메뉴">
        <button type="button" id="editProfileButton" class="dropdown-item" data-action="edit-profile">
          회원정보 수정
        </button>

        <button type="button" id="editPasswordButton" class="dropdown-item" data-action="edit-password">
          비밀번호 수정
        </button>

        <button type="button" id="logoutButton" class="dropdown-item" data-action="logout">
          로그아웃
        </button>
      </nav>
    </div>
  </header>

  <main class="post-detail-page">
    <article id="postDetail" class="post-detail-container" data-page="post-detail">

      <section class="post-header-section" aria-labelledby="postTitle">
        <div class="content-inner">
          <h2 id="postTitle" class="post-detail-title" data-post-field="title"></h2>

          <div class="post-meta-row">
            <div class="post-writer-meta">
              <img id="postWriterProfileImage" class="writer-profile-image" alt="게시글 작성자 프로필 이미지"
                data-post-field="writerProfileImage" />

              <span id="postWriterNickname" class="writer-nickname" data-post-field="writerNickname"></span>

              <time id="postCreatedAt" class="created-at" data-post-field="createdAt"></time>

              <span id="postEditedLabel" class="edited-label hidden" data-post-field="postEditedLabel">
                수정됨
              </span>
            </div>

            <div id="postOwnerActions" class="owner-actions hidden" data-visible-for="post-owner">
              <button type="button" id="editPostButton" class="outline-action-button" data-action="edit-post">
                수정
              </button>

              <button type="button" id="deletePostButton" class="outline-action-button"
                data-action="open-delete-post-modal" data-modal-target="deletePostModal">
                삭제
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="section-divider"></div>


      <section class="post-image-section" aria-label="게시글 이미지">
        <div class="content-inner">
          <div id="postImageSlider" class="post-image-slider" data-component="image-slider">
            <button type="button" id="prevImageButton" class="image-nav-button image-nav-button-left"
              data-action="prev-image" aria-label="이전 이미지 보기">
              ‹
            </button>

            <img id="postImage" class="post-image" alt="게시글 이미지" data-post-field="postImage" />

            <button type="button" id="nextImageButton" class="image-nav-button image-nav-button-right"
              data-action="next-image" aria-label="다음 이미지 보기">
              ›
            </button>

            <div id="imageCounter" class="image-counter hidden" data-state="image-counter"></div>
          </div>
        </div>
      </section>


      <section class="post-body-section" aria-label="게시글 본문">
        <div class="content-inner">
          <p id="postBody" class="post-body" data-post-field="body"></p>
        </div>
      </section>


      <section class="post-count-section" aria-label="게시글 반응 정보">
        <div class="post-count-list">
          <button type="button" id="likeButton" class="count-box like-button disabled" data-action="toggle-like"
            aria-label="좋아요 누르기">
            <strong id="likeCount" data-post-field="likeCount"></strong>
            <strong>좋아요수</strong>
          </button>

          <div class="count-box" data-post-field="viewBox">
            <strong id="viewCount" data-post-field="viewCount"></strong>
            <strong>조회수</strong>
          </div>

          <div class="count-box" data-post-field="commentBox">
            <strong id="commentCount" data-post-field="commentCount"></strong>
            <strong>댓글</strong>
          </div>
        </div>
      </section>

      <div class="section-divider"></div>


      <section class="comment-write-section" aria-label="댓글 작성">
        <form id="commentForm" class="comment-form" data-form="comment">
          <textarea id="commentInput" class="comment-input" name="comment" placeholder="댓글을 남겨주세요!" data-input="comment"
            rows="5"></textarea>

          <div class="comment-form-divider"></div>

          <div class="comment-submit-row">
            <button type="submit" id="commentSubmitButton" class="comment-submit-button disabled"
              data-action="submit-comment" disabled>
              댓글 등록
            </button>
          </div>
        </form>
      </section>


      <section class="comment-list-section" aria-label="댓글 목록">
        <div id="commentList" class="comment-list" data-list="comments">
        </div>
      </section>
    </article>
  </main>

  <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>


  <div id="deletePostModal" class="modal-overlay hidden" data-modal="delete-post" aria-hidden="true">
    <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deletePostModalTitle"
      aria-describedby="deletePostModalDescription">
      <div class="modal-content">
        <h2 id="deletePostModalTitle" class="modal-title">
          게시글을 삭제하시겠습니까?
        </h2>

        <p id="deletePostModalDescription" class="modal-description">
          삭제한 내용은 복구할 수 없습니다.
        </p>

        <div class="modal-button-row">
          <button type="button" id="cancelDeletePostButton" class="modal-button modal-cancel-button"
            data-action="cancel-delete-post">
            취소
          </button>

          <button type="button" id="confirmDeletePostButton" class="modal-button modal-confirm-button"
            data-action="confirm-delete-post">
            확인
          </button>
        </div>
      </div>
    </section>
  </div>


  <div id="deleteCommentModal" class="modal-overlay hidden" data-modal="delete-comment" aria-hidden="true">
    <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteCommentModalTitle"
      aria-describedby="deleteCommentModalDescription">
      <div class="modal-content">
        <h2 id="deleteCommentModalTitle" class="modal-title">
          댓글을 삭제하시겠습니까?
        </h2>

        <p id="deleteCommentModalDescription" class="modal-description">
          삭제한 내용은 복구할 수 없습니다.
        </p>

        <div class="modal-button-row">
          <button type="button" id="cancelDeleteCommentButton" class="modal-button modal-cancel-button"
            data-action="cancel-delete-comment">
            취소
          </button>

          <button type="button" id="confirmDeleteCommentButton" class="modal-button modal-confirm-button"
            data-action="confirm-delete-comment">
            확인
          </button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./post-detail.js"></script>
</body>

</html>
