<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>비밀번호 수정</title>

  <link rel="stylesheet" href="./password-edit.css" />
</head>

<body>
  <header class="top-banner">
    <button type="button" id="backButton" class="back-button" data-action="go-post-list" aria-label="게시글 목록 페이지로 이동">
      &lt;
    </button>

    <h1 class="banner-title">아무 말 대잔치</h1>

    <div class="header-profile-area" data-component="profile-menu">
      <button type="button" id="headerProfileButton" class="header-profile-button" data-action="toggle-profile-menu"
        aria-label="프로필 메뉴 열기" aria-haspopup="true" aria-expanded="false">
        <img id="headerProfileImage" class="header-profile-image" src="../images/default-profile.png" alt="사용자 프로필 이미지"
          data-profile="current-user" />
      </button>

      <nav id="profileDropdown" class="profile-dropdown hidden" data-menu="profile" aria-label="프로필 메뉴">
        <button type="button" id="editProfileButton" class="dropdown-item" data-action="edit-profile">
          회원정보 수정
        </button>

        <button type="button" id="editPasswordButton" class="dropdown-item" data-action="edit-password">
          비밀번호 수정
        </button>

        <button type="button" id="logoutButton" class="dropdown-item" data-action="logout">
          로그아웃
        </button>
      </nav>
    </div>
  </header>

  <main class="password-edit-page">
    <section class="password-edit-container" aria-labelledby="passwordEditTitle">
      <h2 id="passwordEditTitle" class="password-edit-title">
        비밀번호 수정
      </h2>

      <form id="passwordEditForm" class="password-edit-form" data-form="password-edit">
        <div class="password-field-section" data-field="password">
          <label for="passwordInput" class="password-form-label">
            비밀번호
          </label>

          <input type="password" id="passwordInput" required class="password-input" name="password" minlength="8"
            maxlength="20" placeholder="비밀번호를 입력하세요" autocomplete="new-password" data-input="password" />

          <p id="passwordError" class="password-error-message hidden" data-error="password">
          </p>
        </div>

        <div class="password-field-section password-confirm-section" data-field="password-confirm">
          <label for="passwordConfirmInput" class="password-form-label">
            비밀번호 확인
          </label>

          <input type="password" id="passwordConfirmInput" required class="password-input" name="passwordConfirm"
            minlength="8" maxlength="20" placeholder="비밀번호를 한번 더 입력하세요" autocomplete="new-password"
            data-input="password-confirm" />

          <p id="passwordConfirmError" class="password-error-message hidden" data-error="password-confirm">
          </p>
        </div>

        <button type="submit" id="passwordEditSubmitButton" class="password-edit-submit-button disabled"
          data-action="submit-password-edit" disabled>
          수정하기
        </button>
      </form>

      <div id="passwordEditToast" class="password-edit-toast hidden" data-toast="password-edit-success" role="status"
        aria-live="polite">
        수정 완료
      </div>
    </section>
  </main>
  <div id="serverErrorToast" class="server-error-toast hidden" role="alert" aria-live="assertive"></div>
  <script type="module" src="./password-edit.js"></script>
</body>

</html>
